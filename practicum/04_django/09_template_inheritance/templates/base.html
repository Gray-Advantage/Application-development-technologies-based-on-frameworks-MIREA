<!DOCTYPE html>
<html lang="ru">
  <head>
    <!--
    Уберите повторяющуюся разметку четырёх страниц. Создайте
    templates/base.html и templates/includes/header.html,
    templates/includes/footer.html. Вынесите header и footer в отдельные
    шаблоны и подключите их внутри body базового шаблона тегами include.
    В base.html объявите блок title внутри title и блок content для
    основного содержимого. Шаблоны about/description.html,
    homepage/index.html, ice_cream/detail.html и ice_cream/list.html должны
    расширять base.html и определять собственные блоки title и content.
    -->
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body>
    {% include "includes/header.html" %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}
  </body>
</html>
