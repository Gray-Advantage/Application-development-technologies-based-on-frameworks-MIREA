<!DOCTYPE html>
<!--
Дополните DOM-дерево: html содержит head с title и body.
В body расположены header, main и footer. В header вложены nav,
затем div и a. Ссылка a содержит img и span. В footer вложен p со span.
Содержимое может быть любым. Изменяйте templates/homepage/index.html.
-->
<html lang="ru">
  <head>
    <title>Анфиса для друзей</title>
  </head>
  <body>
    <header>
      <nav>
        <div>
          <a href="/">
            <img
              src=
          "data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'/%3E"
              alt="Логотип сайта"
            >
            <span>Главная страница</span>
          </a>
        </div>
      </nav>
    </header>
    <main>Основное содержимое страницы</main>
    <footer>
      <p><span>Анфиса для друзей</span></p>
    </footer>
  </body>
</html>
