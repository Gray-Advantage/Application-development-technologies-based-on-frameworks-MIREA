<p><i>С. Маршак и Д. Хармс</i></p>

<p>
  Жили в квартире<br>
  Сорок четыре<br>
  Сорок четыре<br>
  Веселых чижа:<br>
</p>

<ul>
  <li>Чиж-судомойка,</li>

  <li>Чиж-водовоз,</li>
  <li>Чиж за кухарку,</li>
  <li>Чиж за хозяйку,</li>
