<!DOCTYPE html>
<html lang="ru">
  <head>
    {% load static %}
    <link rel="icon" href="{% static 'img/fav/fav.png' %}" type="image">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/fav/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/fav/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/fav/favicon-16x16.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <title>
      {% block title %}{% endblock %}
    </title>
  </head>
  <body>
    {% include "includes/header.html" %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}
  </body>
</html>
<!--
Настройте поиск статики в static_dev на уровне проекта. В базовом шаблоне
подключите bootstrap.min.css и fav-иконки через тег static. В шаблоне
includes/header.html подключите img/logo.png. В каждом шаблоне,
использующем static, загрузите библиотеку static.
-->
