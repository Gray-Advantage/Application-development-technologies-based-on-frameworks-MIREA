<!DOCTYPE html>
<!--
Сверстайте страницу по схеме: header содержит nav; далее идут aside,
main с section и двумя вложенными article; внизу footer с nav.
Текст блоков может быть любым. Цветной фон и границы не требуются.
-->
<html>
  <head>
    <meta charset="utf-8">
    <meta name="description" content="Семантика - сила">
    <title>Тестовое задание на понимание семантических блоков</title>
  </head>
  <body>
    <header>
      <nav>Навигация по сайту</nav>
    </header>
    <aside>Дополнительная информация</aside>
    <main>
      <section>
        <article>Первая публикация</article>
        <article>Вторая публикация</article>
      </section>
    </main>
    <footer>
      <nav>Навигация в подвале</nav>
    </footer>
  </body>
</html>
