<!DOCTYPE html>
<!--
Напишите код по DOM-дереву: html содержит head с title и body;
body содержит header с nav, затем main и footer. Содержимое тегов
может быть любым, но теги не должны оставаться пустыми.
-->
<html lang="ru">
  <head>
    <title>Анфиса для друзей</title>
  </head>
  <body>
    <header>
      <nav>Навигация по сайту</nav>
    </header>
    <main>Основное содержимое страницы</main>
    <footer>Подвал страницы</footer>
  </body>
</html>
