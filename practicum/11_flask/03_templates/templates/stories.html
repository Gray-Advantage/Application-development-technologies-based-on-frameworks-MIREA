{% extends 'base.html' %}

<!--
Ваша задача — организовать вывод рассказов в проекте RandomStory на веб-страницах.

Для этого напишите два шаблона:

1. Шаблон главной страницы *stories.html*. На эту страницу выводятся все рассказы, которые есть в базе.

    Требования к шаблону:

    - каждый рассказ расположен внутри блока `div` с CSS-классом `card-body`;
    - внутри блока `div` находятся заголовок `<h5>` с CSS-классом `card-title` и абзац `<p>` с классом `card-text`.

    ```html
    <div class=...>
      <h5 class=...>Заголовок рассказа</h5>
      <p class=...>Текст рассказа</p>
    </div>

    <div class=...>
      <h5 class=...>Заголовок следующего рассказа</h5>
      <p class=...>Текст следующего рассказа</p>
    </div>
    ...
    ```

2. Шаблон для страницы, на которой выводится один случайный рассказ random.html.

    Требования к шаблону:

    - на странице есть заголовок `h1` с названием рассказа и блок `div` с CSS-классом `card-body`;
    - внутри блока `div` размещён абзац `<p>` с классом `card-text` — это абзац с текстом рассказа.

    ```html
    <h1>Заголовок рассказа</h1>
    <div class=...>
      <p class=...>Текст рассказа</p>
    </div>
    ```
-->

{% block title %}Все рассказы RandomStory{% endblock %}

{% block content %}
  <h1 class="text-center mb-4">RandomStory: короткие рассказы</h1>
  {% for story in stories %}
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ story.title }}</h5>
        <p class="card-text">{{ story.text }}</p>
      </div>
    </div>
  {% endfor %}
{% endblock %}
