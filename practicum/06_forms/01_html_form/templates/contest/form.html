{% extends "base.html" %}
{% comment %}
<!--
Объявляется конкурс на лучший рецепт мороженого, приглашаются все друзья
Анфисы.

Рецепты на конкурс должны отправляться через форму, со страницы сайта. Ваша
задача — обеспечить IT-поддержку конкурсу и создать эту форму.

Работа предстоит большая, двигаться будем поэтапно. Сначала надо сделать MVP и
продемонстрировать, как примерно будет происходить отправка заявки на конкурс.

В тренажёре развёрнут Django-проект; в директории *templates/contest/*
подготовлен шаблон *form.html*, с которым вам предстоит поработать.

В файле *templates/contest/form.html* сверстайте HTML-форму для страницы
*/contest/* (”*contest” —* «конкурс»).

В форме должны быть такие поля:

1. **Название** мороженого**:** поле ввода текста; `name="title"`.
Обязательное.
2. **Описание** мороженого**:** поле ввода текста; `name="description"`.
Обязательное.
3. **Цена:** поле для ввода чисел; `name="price"`. Обязательное. Строчка с
подсказкой: «Рекомендованная розничная цена».
4. **Комментарий:** поле для ввода текста; `name="comment"`. Необязательное.

Для каждого поля создайте заголовок `label`, связанный с полем через атрибут
`for`. Значения для `id` и `for` должны быть теми же, что и `name` поля.

Каждая пара «заголовок_поля + поле_ввода» должна быть обёрнута в тег <p>.

Подсказки для цены оберните в тег `<small>` — он выводит текст мелким шрифтом.

Должно получиться так:

![](https://pictures.s3.yandex.net:443/resources/142_1682606663.png)

В файлах *contest/views.py* и *contest/urls.py уже* подготовлены view-функции и
маршруты, которые обработают запрос, ваша задача — только сверстать HTML-форму.

В теге `form` с помощью тега шаблонизатора `{% url ... %}` укажите адрес, куда
должен отправляться запрос. Форма должна отправлять информацию методом GET на
адрес */contest/accepted/*.

Чтобы в ходе работы просмотреть, что у вас получается — нажмите «Задеплоить»,
затем в браузере тренажёра кликните по ссылке «Ваш проект» и в меню сайта
кликните по ссылке «Конкурс». После того, как вы внесёте изменения — вновь
жмите «Задеплоить», после деплоя обновите вкладку, в которой открыта страница
«Конкурс».
-->
{% endcomment %}

{% block title %}
  Подать заявку на конкурс
{% endblock %}

{% block content %}
  <form action="{% url 'contest:accepted' %}" method="get">
    <p>
      <label for="title">Название:</label>
      <input type="text" name="title" id="title" required>
    </p>
    <p>
      <label for="description">Описание:</label>
      <input type="text" name="description" id="description" required>
    </p>
    <p>
      <label for="price">Цена:</label>
      <input type="number" name="price" id="price" required>
      <small>Рекомендованная розничная цена</small>
    </p>
    <p>
      <label for="comment">Комментарий:</label>
      <input type="text" name="comment" id="comment">
    </p>
    <input type="submit" value="Отправить">
  </form>
{% endblock %}
