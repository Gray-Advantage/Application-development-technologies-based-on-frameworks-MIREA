{% extends "base.html" %}
{% comment %}
<!--
В проекте «Анфиса для друзей» вы сверстали HTML-форму для конкурса мороженого.
На новом уровне знаний эту форму можно и нужно модифицировать.

Опишите форму как Python-класс; к форме есть и дополнительные требования — их
тоже реализуйте в классе формы.

В файле *contest/forms.py* опишите класс `ContestForm`.

В форме должны быть такие поля:

1. **Название:** поле ввода текста; имя поля: `title`. Обязательное, максимум
20 символов.
2. **Описание:** поле ввода текста; имя поля: `description`. Обязательное. Это
поле должно быть многострочным, такого в уроке не было. Название нужного
виджета можно найти [в
документации](https://docs.djangoproject.com/en/5.2/ref/forms/widgets/#textarea
){target="blank"}.
В [исходниках
кода](https://docs.djangoproject.com/en/5.2/_modules/django/forms/widgets/#Text
area){target="blank"}
можно найти и информацию, как изменить размер этого поля ввода.
3. **Цена:** поле для ввода чисел; имя поля: `price`. Обязательное. Строчка с
подсказкой: «Рекомендованная розничная цена». Минимальная цена — 10,
максимальная — 100. Как установить эти ограничения — посмотрите [в
документации](https://docs.djangoproject.com/en/5.2/ref/forms/fields/#integerfi
eld){target="blank"}.
4. **Комментарий:** поле ввода текста; имя поля: `comment`. Необязательное, с
виджетом многострочного поля ввода, как и поле **Описание.**

В файле *contest/views.py* доработайте функцию `proposal_create()` так, чтобы
она передавала в словаре контекста экземпляр класса `ContestForm`.

Выведите форму в шаблон *templates/contest/form.html*. Поля формы должны быть
выведены в виде HTML-таблицы.

Форма должна отправлять GET-запрос на адрес */contest/accepted/*.

После выполнения задания задеплойте код и откройте страницу с формой: кликните
по ссылке в верхней правой части тренажёра («Ваш проект») и перейдите на
страницу */contest/*.

Форма должна выглядеть примерно как на картинке:

![](https://pictures.s3.yandex.net:443/resources/129_1682595859.png)
-->
{% endcomment %}

{% block title %}
  Подать заявку на конкурс
{% endblock %}

{% block content %}
  <form action="{% url 'contest:accepted' %}" method="get">
    <table>
      {{ form.as_table }}
    </table>
    <input type="submit" value="Отправить">
  </form>
{% endblock %}
